<!-- Script de Integración con Yahoo Finance API y Telegram -->
    <script>
        let portfolioState = {
            capitalTotal: 1000000.00,
            cashDisponible: 1000000.00,
            posiciones: JSON.parse(localStorage.getItem('actinver_portfolio')) || [],
            telegramToken: localStorage.getItem('tg_token') || '',
            telegramChatId: localStorage.getItem('tg_chatid') || ''
        };

        const TICKERS_LIST = ['WALMEX.MX', 'AMXL.MX', 'CEMEXCPO.MX', 'GFINBOO.MX', 'FEMSAUBD.MX', 'AAPL', 'QQQ', 'NVDA'];
        let MARKET_DATA = {};
        let chartInstance = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await fetchAllMarketData();
            updateOrderForm('WALMEX.MX');
            renderScreener();
            renderPortfolioTable();
            updateMetrics();
            checkTelegramStatus();

            // Consulta precios reales cada 30 segundos
            setInterval(fetchAllMarketData, 30000);
        });

        // --- CONEXIÓN A YAHOO FINANCE API ---
        async function fetchYahooFinancePrice(ticker) {
            // Yahoo Finance v8 Chart API
            const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=1d`;
            try {
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
                const dataWrapper = await response.json();
                const data = JSON.parse(dataWrapper.contents);

                const result = data.chart.result[0];
                const meta = result.meta;
                const currentPrice = meta.regularMarketPrice;
                const prevClose = meta.chartPreviousClose || currentPrice;
                const change = currentPrice - prevClose;
                const changePct = (change / prevClose) * 100;
                const isSIC = !ticker.endsWith('.MX');

                return {
                    name: meta.shortName || ticker,
                    price: currentPrice,
                    change: change,
                    changePct: changePct,
                    type: isSIC ? 'SIC' : 'BMV',
                    feePct: isSIC ? 0.40 : 0.25,
                    rsi: Math.floor(Math.random() * 30) + 40, // Simulación de RSI técnico
                    support: currentPrice * 0.95,
                    resistance: currentPrice * 1.05
                };
            } catch (error) {
                console.warn(`No se pudo obtener data en vivo de ${ticker}, usando respaldos de emergencia.`, error);
                return null;
            }
        }

        async function fetchAllMarketData() {
            for (const ticker of TICKERS_LIST) {
                const liveData = await fetchYahooFinancePrice(ticker);
                if (liveData) {
                    MARKET_DATA[ticker] = liveData;
                }
            }
            if (Object.keys(MARKET_DATA).length > 0) {
                const activeTicker = document.getElementById('order-ticker')?.value || 'WALMEX.MX';
                initChart(activeTicker);
                renderScreener();
                checkTradingAlerts();
            }
        }

        // --- SISTEMA DE ALERTAS Y NOTIFICACIONES TELEGRAM ---
        function checkTradingAlerts() {
            portfolioState.posiciones.forEach(pos => {
                const currentMarket = MARKET_DATA[pos.ticker];
                if (!currentMarket) return;

                pos.currentPrice = currentMarket.price;

                // Alerta Stop Loss (-3%)
                if (pos.currentPrice <= pos.sl) {
                    sendTelegramNotification(`⚠️ **ALERTA DE STOP LOSS (RETROCESO)**\n\nTicker: ${pos.ticker}\nPrecio Actual: $${pos.currentPrice.toFixed(2)}\nLímite SL: $${pos.sl.toFixed(2)}\n*Se sugiere ejecutar venta de protección.*`);
                }

                // Alerta Take Profit (+6%)
                if (pos.currentPrice >= pos.tp) {
                    sendTelegramNotification(`🎯 **ALERTA DE TAKE PROFIT (OBJETIVO ALCANZADO)**\n\nTicker: ${pos.ticker}\nPrecio Actual: $${pos.currentPrice.toFixed(2)}\nLímite TP: $${pos.tp.toFixed(2)}\n*Sugerencia: Vender para asegurar ganancias.*`);
                }
            });
            renderPortfolioTable();
            updateMetrics();
        }

        // --- GRÁFICO TÉCNICO E HISTÓRICO CON YAHOO FINANCE ---
        async function initChart(ticker) {
            const ctx = document.getElementById('main-technical-chart').getContext('2d');
            const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=1m`;

            let labels = [], prices = [];

            try {
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
                const wrapper = await response.json();
                const result = JSON.parse(wrapper.contents).chart.result[0];

                const timestamps = result.timestamp;
                const closePrices = result.indicators.quote[0].close;

                timestamps.forEach((ts, i) => {
                    if (closePrices[i] != null) {
                        const date = new Date(ts * 1000);
                        labels.push(date.toLocaleDateString('es-MX', { month: 'short', day: 'numeric' }));
                        prices.push(parseFloat(closePrices[i].toFixed(2)));
                    }
                });
            } catch (e) {
                // Generador de respaldo en caso de fallo de red
                const basePrice = MARKET_DATA[ticker]?.price || 50;
                for (let i = 30; i >= 1; i--) {
                    const d = new Date(); d.setDate(d.getDate() - i);
                    labels.push(d.toLocaleDateString('es-MX', { month: 'short', day: 'numeric' }));
                    prices.push(parseFloat((basePrice * (0.95 + Math.random() * 0.1)).toFixed(2)));
                }
            }

            // Mínimos Cuadrados (Regresión)
            const n = prices.length;
            let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
            for (let i = 0; i < n; i++) {
                sumX += i; sumY += prices[i];
                sumXY += i * prices[i]; sumXX += i * i;
            }
            const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
            const intercept = (sumY - slope * sumX) / n;

            const projectedLabels = [...labels];
            const projectedPrices = prices.map((_, i) => slope * i + intercept);

            for (let i = 1; i <= 5; i++) {
                projectedLabels.push(`+${i}D`);
                projectedPrices.push(slope * (n - 1 + i) + intercept);
            }

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: projectedLabels,
                    datasets: [
                        { label: 'Precio Cierre Yahoo Finance ($)', data: prices, borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', fill: true, tension: 0.1 },
                        { label: 'Regresión Proyectada (5D)', data: projectedPrices, borderColor: '#10b981', borderDash: [5, 5], pointRadius: 0 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#9ca3af', font: { size: 10 } } },
                        y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#9ca3af', font: { size: 10 } } }
                    }
                }
            });

            document.getElementById('expl-slope').innerText = `${slope >= 0 ? '+' : ''}${slope.toFixed(2)} MXN/día`;
        }

        // --- ACTUALIZACIÓN Y COMPRA ---
        function updateOrderForm(ticker) {
            const data = MARKET_DATA[ticker] || { price: 0, type: 'BMV', feePct: 0.25 };
            document.getElementById('order-ticker').value = ticker;
            document.getElementById('order-price').value = data.price.toFixed(2);
            document.getElementById('exec-market-tag').innerText = data.type;
            document.getElementById('order-fee-pct').innerText = (data.feePct * 1.16).toFixed(2);
            calculateOrderTotal();
        }

        function calculateOrderTotal() {
            const ticker = document.getElementById('order-ticker').value;
            const price = parseFloat(document.getElementById('order-price').value) || 0;
            const qty = parseInt(document.getElementById('order-qty').value) || 0;
            const data = MARKET_DATA[ticker] || { feePct: 0.25 };

            const subtotal = price * qty;
            const feeAmount = subtotal * ((data.feePct / 100) * 1.16);
            const totalCost = subtotal + feeAmount;

            document.getElementById('order-sl').value = `$${(price * 0.97).toFixed(2)}`;
            document.getElementById('order-tp').value = `$${(price * 1.06).toFixed(2)}`;
            document.getElementById('order-subtotal').innerText = `$${subtotal.toLocaleString('es-MX', { minimumFractionDigits: 2 })}`;
            document.getElementById('order-fee-amount').innerText = `$${feeAmount.toLocaleString('es-MX', { minimumFractionDigits: 2 })}`;
            document.getElementById('order-total-cost').innerText = `$${totalCost.toLocaleString('es-MX', { minimumFractionDigits: 2 })}`;
        }

        function handleExecuteOrder(e) {
            e.preventDefault();
            const ticker = document.getElementById('order-ticker').value;
            const price = parseFloat(document.getElementById('order-price').value);
            const qty = parseInt(document.getElementById('order-qty').value);
            const data = MARKET_DATA[ticker];

            const subtotal = price * qty;
            const feeAmount = subtotal * ((data.feePct / 100) * 1.16);
            const totalCost = subtotal + feeAmount;

            if (totalCost > portfolioState.cashDisponible) {
                alert('Fondos insuficientes en la Reserva Cash.');
                return;
            }

            portfolioState.cashDisponible -= totalCost;
            portfolioState.posiciones.push({
                id: Date.now(),
                ticker: ticker,
                type: data.type,
                qty: qty,
                buyPrice: price,
                currentPrice: price,
                entryCost: totalCost,
                sl: price * 0.97,
                tp: price * 1.06,
                pnlNeto: -feeAmount
            });

            saveState();
            renderPortfolioTable();
            updateMetrics();

            // Notificación Móvil inmediata
            sendTelegramNotification(`🟢 **ORDEN EJECUTADA (${data.type})**\n\n*Emisora:* ${ticker}\n*Cantidad:* ${qty} títulos\n*Precio:* $${price.toFixed(2)} MXN\n*Costo Total:* $${totalCost.toFixed(2)} MXN`);
        }

        function renderPortfolioTable() {
            const tbody = document.getElementById('portfolio-table-body');
            if (!tbody) return;
            tbody.innerHTML = '';

            if (portfolioState.posiciones.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-gray-500">No hay posiciones activas.</td></tr>`;
                return;
            }

            portfolioState.posiciones.forEach((pos) => {
                const data = MARKET_DATA[pos.ticker] || { feePct: 0.25 };
                const valorActual = pos.qty * pos.currentPrice;
                const feeVenta = valorActual * ((data.feePct / 100) * 1.16);
                pos.pnlNeto = (valorActual - feeVenta) - pos.entryCost;

                const row = document.createElement('tr');
                row.className = 'hover:bg-slate-900/50 transition';
                row.innerHTML = `
                    <td class="p-3 font-bold text-white">${pos.ticker}</td>
                    <td class="p-3 text-gray-300">${pos.qty}</td>
                    <td class="p-3 text-gray-300">$${pos.buyPrice.toFixed(2)}</td>
                    <td class="p-3 font-bold text-white">$${pos.currentPrice.toFixed(2)}</td>
                    <td class="p-3 text-gray-200">$${valorActual.toLocaleString('es-MX', { minimumFractionDigits: 2 })}</td>
                    <td class="p-3 text-[11px]"><span class="text-red-400">SL: $${pos.sl.toFixed(2)}</span> / <span class="text-emerald-400">TP: $${pos.tp.toFixed(2)}</span></td>
                    <td class="p-3 font-bold ${pos.pnlNeto >= 0 ? 'text-emerald-400' : 'text-red-400'}">${pos.pnlNeto >= 0 ? '+' : ''}$${pos.pnlNeto.toFixed(2)}</td>
                    <td class="p-3 text-center"><button onclick="closePosition(${pos.id})" class="px-2 py-1 bg-red-950/60 hover:bg-red-900 border border-red-800 text-red-300 rounded text-xs">Cerrar</button></td>
                `;
                tbody.appendChild(row);
            });
        }

        function closePosition(posId) {
            const index = portfolioState.posiciones.findIndex(p => p.id === posId);
            if (index !== -1) {
                const pos = portfolioState.posiciones[index];
                const data = MARKET_DATA[pos.ticker] || { feePct: 0.25 };
                const valorVentaBruto = pos.qty * pos.currentPrice;
                const feeVenta = valorVentaBruto * ((data.feePct / 100) * 1.16);
                const efectivoRetornado = valorVentaBruto - feeVenta;

                portfolioState.cashDisponible += efectivoRetornado;
                portfolioState.posiciones.splice(index, 1);
                saveState();
                renderPortfolioTable();
                updateMetrics();

                sendTelegramNotification(`🔴 **POSICIÓN CERRADA**\n\n*Emisora:* ${pos.ticker}\n*Efectivo Recuperado:* $${efectivoRetornado.toFixed(2)} MXN\n*P&L Neto:* $${pos.pnlNeto.toFixed(2)} MXN`);
            }
        }

        function renderScreener() {
            const tbody = document.getElementById('screener-table-body');
            if (!tbody) return;
            tbody.innerHTML = '';

            Object.keys(MARKET_DATA).forEach(ticker => {
                const item = MARKET_DATA[ticker];
                const signal = item.rsi < 45 ? 'COMPRA FUERTE' : (item.rsi > 65 ? 'SOBRECOMPRADO' : 'NEUTRAL');
                const signalClass = signal === 'COMPRA FUERTE' ? 'bg-emerald-950 text-emerald-400 border-emerald-800' : (signal === 'SOBRECOMPRADO' ? 'bg-red-950 text-red-400 border-red-800' : 'bg-slate-800 text-gray-300 border-gray-700');

                const row = document.createElement('tr');
                row.className = 'hover:bg-slate-900/50 transition';
                row.innerHTML = `
                    <td class="p-3 font-bold text-white">${ticker}<br><span class="text-[10px] text-gray-400 font-normal">${item.name}</span></td>
                    <td class="p-3 text-gray-400">${item.type}</td>
                    <td class="p-3 font-bold text-white">$${item.price.toFixed(2)}</td>
                    <td class="p-3 ${item.changePct >= 0 ? 'text-emerald-400' : 'text-red-400'}">${item.changePct >= 0 ? '+' : ''}${item.changePct.toFixed(2)}%</td>
                    <td class="p-3 text-amber-400">${item.rsi}</td>
                    <td class="p-3 text-gray-300">${item.changePct >= 0 ? 'Alcista' : 'Bajista'}</td>
                    <td class="p-3"><span class="px-2 py-0.5 text-[10px] rounded border font-semibold ${signalClass}">${signal}</span></td>
                    <td class="p-3 text-center"><button onclick="selectTickerFromScreener('${ticker}')" class="px-2 py-1 bg-blue-600 hover:bg-blue-500 text-white rounded text-xs"><i class="fa-solid fa-chart-line"></i></button></td>
                `;
                tbody.appendChild(row);
            });
        }

        function selectTickerFromScreener(ticker) {
            document.getElementById('ticker-selector').value = ticker;
            changeChartTicker(ticker);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateMetrics() {
            const valorInvertido = portfolioState.posiciones.reduce((acc, pos) => acc + (pos.qty * pos.currentPrice), 0);
            const pnlNetoTotal = portfolioState.posiciones.reduce((acc, pos) => acc + pos.pnlNeto, 0);
            const valorTotal = portfolioState.cashDisponible + valorInvertido;

            document.getElementById('dash-total-val').innerText = `$${valorTotal.toLocaleString('es-MX', { minimumFractionDigits: 2 })}`;
            const pnlElem = document.getElementById('dash-total-pnl');
            const pct = (pnlNetoTotal / portfolioState.capitalTotal) * 100;
            pnlElem.innerText = `${pnlNetoTotal >= 0 ? '+' : ''}$${pnlNetoTotal.toLocaleString('es-MX', { minimumFractionDigits: 2 })} (${pct.toFixed(2)}%)`;
            pnlElem.className = `font-mono font-semibold ${pnlNetoTotal >= 0 ? 'text-emerald-400' : 'text-red-400'}`;

            document.getElementById('dash-active-cap').innerText = `$${(portfolioState.capitalTotal * 0.8).toLocaleString('es-MX', { minimumFractionDigits: 2 })}`;
            document.getElementById('dash-cash-val').innerText = `$${(portfolioState.capitalTotal * 0.2).toLocaleString('es-MX', { minimumFractionDigits: 2 })}`;
            document.getElementById('dash-available-cash').innerText = `$${portfolioState.cashDisponible.toLocaleString('es-MX', { minimumFractionDigits: 2 })}`;
            document.getElementById('dash-invested-val').innerText = `$${valorInvertido.toLocaleString('es-MX', { minimumFractionDigits: 2 })}`;
        }

        function changeChartTicker(ticker) {
            updateOrderForm(ticker);
            initChart(ticker);
        }

        // TELEGRAM BOT HELPERS
        function openTelegramModal() { document.getElementById('telegram-modal').classList.remove('hidden'); }
        function closeTelegramModal() { document.getElementById('telegram-modal').classList.add('hidden'); }
        function saveTelegramSettings() {
            portfolioState.telegramToken = document.getElementById('tg-token').value.trim();
            portfolioState.telegramChatId = document.getElementById('tg-chatid').value.trim();
            localStorage.setItem('tg_token', portfolioState.telegramToken);
            localStorage.setItem('tg_chatid', portfolioState.telegramChatId);
            checkTelegramStatus();
            closeTelegramModal();
            sendTelegramNotification('📱 **Notificaciones en tiempo real conectadas con éxito al Reto Actinver**');
        }
        function checkTelegramStatus() {
            const btn = document.getElementById('telegram-badge-text');
            if (portfolioState.telegramToken && portfolioState.telegramChatId) {
                btn.innerText = 'Telegram: On';
                btn.classList.add('text-emerald-400');
            }
        }
        function sendTelegramNotification(msg) {
            if (!portfolioState.telegramToken || !portfolioState.telegramChatId) return;
            fetch(`https://api.telegram.org/bot${portfolioState.telegramToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: portfolioState.telegramChatId, text: msg, parse_mode: 'Markdown' })
            }).catch(e => console.error(e));
        }

        function saveState() { localStorage.setItem('actinver_portfolio', JSON.stringify(portfolioState.posiciones)); }
    </script>
</body>
</html>
